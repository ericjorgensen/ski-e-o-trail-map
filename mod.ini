[Mod]
Version = 1
Id = trail-map-sign
Release = 1.0.0
GameVersion = CL7918
Name = Trail Map Sign
Description = Adds a big wooden trail map board to Build > Decorations, drawn from your resort's own trails and lifts.
Usage = Open Build > Decorations and pick Trail Map Sign. Place it like any decoration: Q and E rotate it. Click the board to bulldoze it. The map is drawn when the first sign appears; after you change trails or lifts, press Ctrl+Alt+Y to redraw every sign. Turning the mod off turns signs back into plain flags.
ManagedKeybinds = true

[Keybinds]
Refresh trail maps = Ctrl+Alt+Y
